[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-protocol"
version = "0.3.0"
description = "A reproducible evolutionary computing laboratory for software organisms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License pending" }
authors = [{ name = "Genesis Protocol contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10", "playwright>=1.50"]
research = ["deap>=1.4"]

[project.scripts]
genesis-run = "genesis_protocol.cli:main"
genesis-ecology = "genesis_protocol.ecology_cli:main"
genesis-research-validation = "genesis_protocol.validation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.coverage.run]
omit = ["src/genesis_protocol/validation.py"]
